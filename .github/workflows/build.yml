name: Build macOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'bump_version')
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        architecture: [arm64, x86_64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Install dependencies (if using CocoaPods)
        run: |
          if [ -f "Podfile" ]; then
            sudo gem install cocoapods
            pod install
          fi
      
      - name: Generate Secrets.xcconfig
        run: |
            echo "IS_DEVELOPMENT = false" >> Secrets.xcconfig
            echo "BRANCH = $BRANCH" >> Secrets.xcconfig
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          BRANCH: ${{ github.ref_name }}
    
      - name: Replace secrets
        run: |
            sed -i '' "s/{{CLIENT_ID}}/$CLIENT_ID/g" PCL.Mac/Secrets.swift
            sed -i '' "s/{{THEME_KEY}}/$THEME_KEY/g" PCL.Mac/Secrets.swift
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          THEME_KEY: ${{ secrets.THEME_KEY }}

      - name: Run deterministic unit tests
        if: matrix.architecture == 'arm64'
        env:
          PCL_RUN_INTEGRATION_TESTS: "0"
        run: |
          xcodebuild test -project PCL.Mac.xcodeproj -scheme PCL-Mac \
            -configuration Debug -destination 'platform=macOS,arch=arm64' \
            -xcconfig Secrets.xcconfig CODE_SIGNING_ALLOWED=NO

      - name: Build ${{ matrix.architecture }} Binary (xcodebuild)
        run: |
          PROJECT="PCL.Mac.xcodeproj"
          SCHEME="PCL-Mac"
          ARCHITECTURE="${{ matrix.architecture }}"

          if [ -d "$PROJECT" ]; then
            xcodebuild -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
              -archivePath "build/PCL.Mac-$ARCHITECTURE" \
              -xcconfig Secrets.xcconfig \
              ARCHS="$ARCHITECTURE" ONLY_ACTIVE_ARCH=YES \
              CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO archive
          else
            echo "PCL.Mac.xcodeproj not found!"
            exit 1
          fi

      - name: Copy ${{ matrix.architecture }} .app
        run: |
          ARCHITECTURE="${{ matrix.architecture }}"
          OUTPUT_DIR="build/Release/$ARCHITECTURE"
          APP_PATH="build/PCL.Mac-$ARCHITECTURE.xcarchive/Products/Applications/PCL.Mac.app"
          mkdir -p "$OUTPUT_DIR"
          if [ -d "$APP_PATH" ]; then
            cp -R "$APP_PATH" "$OUTPUT_DIR/"
          else
            echo "PCL.Mac.app not found!"
            exit 1
          fi

      - name: Verify ${{ matrix.architecture }} Binary
        run: |
          ARCHITECTURE="${{ matrix.architecture }}"
          BINARY="build/Release/$ARCHITECTURE/PCL.Mac.app/Contents/MacOS/PCL.Mac"
          file "$BINARY"
          test "$(lipo -archs "$BINARY")" = "$ARCHITECTURE"

      - name: Zip ${{ matrix.architecture }} PCL.Mac.app
        run: |
          ARCHITECTURE="${{ matrix.architecture }}"
          cd "build/Release/$ARCHITECTURE"
          ditto -c -k --sequesterRsrc --keepParent PCL.Mac.app "../PCL.Mac-$ARCHITECTURE.zip"

      - name: Archive build products
        uses: actions/upload-artifact@v4
        with:
          name: PCL.Mac-${{ matrix.architecture }}
          path: build/Release/PCL.Mac-${{ matrix.architecture }}.zip
